[package]
name = "zeus"
version = "3.0.0"
edition = "2021"
authors = ["Lumen Charts Contributors"]
description = "GPU-accelerated charting library inspired by Lightweight Charts"
license = "Apache-2.0"
repository = "https://github.com/jagtesh/lumen-charts"
homepage = "https://github.com/jagtesh/lumen-charts"
readme = "../README.md"
keywords = ["chart", "gpu", "vello", "wgpu", "trading"]
categories = ["graphics", "rendering", "visualization"]
rust-version = "1.97"

[features]
default = []

[dependencies]
parley = "0.10"
pollster = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
iced = { version = "0.14", default-features = true, features = [
    "canvas",
    "wgpu",
    "thread-pool",
    "advanced",
] }
iced_split = "0.1.0"
